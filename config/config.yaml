inference:
  device: auto
  birefnet_model_path: models/BiRefNet
  clip_model_path: models/clip-ViT-L-14
  dinov2_model: dinov2_vitl14
  use_fp16: false

batch:
  size: 4

search:
  top_k: 10
  clip_pool_threshold: 0.50
  dino_pool_threshold: 0.30
  final_threshold: 0.50
  pool_fallback_size: 20
  use_category_filter: true
  use_material_filter: true
  material_confidence_threshold: 0.20
  category_confidence_threshold: 0.20
  dino_only_penalty: 0.9
  clip_only_penalty: 0.85

database:
  url: "postgresql://user:pass@localhost:5432/jewelry_search"
  pool_size: 5
  max_overflow: 10

# Standalone QA web UI for the trained supervised category classifier
# (see qa_app/). Not used by the indexing/search pipeline.
qa_app:
  host: 0.0.0.0
  port: 5000
  debug: false
  category_classifier_model_dir: model
  upload_dir: data/qa_uploads
  log_csv: data/qa_log.csv
  max_upload_mb: 20
